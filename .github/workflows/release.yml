name: Release

on:
  push:
    tags: ['v*']

# Each job asks for the permissions it needs.
permissions: {}

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

  # The same checks as for pushes to main, on the tagged commit.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The package is built without publishing permissions, so dependencies and
  # third-party actions never run in the job that can publish.
  build:
    name: Build the package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Stage on npm
    needs: [version, ci, build]
    # The environment only allows v* tags, and npm only accepts trusted
    # publishing from this environment.
    environment:
      name: npm
      url: https://www.npmjs.com/package/prettier-plugin-unocss
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Required for npm trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Pre-releases (X.Y.Z-beta.N) go to the next dist-tag, others to latest.
      - id: tag
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      # The tarball from the build job is staged as is; no package scripts run
      # in the job that can publish. A staged version becomes installable only
      # after a maintainer approves it with 2FA on npmjs.com or with
      # `npm stage approve`. The trusted publisher cannot publish directly.
      - run: npm stage publish ./*.tgz --ignore-scripts --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.tag.outputs.dist-tag }}

  # Release notes from conventional commits since the previous tag. A separate
  # job, so changelogithub never runs with the npm publishing permission.
  release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # changelogithub marks X.Y.Z-beta.N tags as pre-releases itself.
      - run: npx --yes changelogithub@15.0.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
