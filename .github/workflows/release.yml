name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # GitHub release with notes from conventional commits since the previous tag
      - run: pnpm dlx changelogithub@15.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
